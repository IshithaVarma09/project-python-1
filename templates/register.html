{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass fade-in register-card">
        <div class="auth-header">
            <h2>Create an Account</h2>
            <p>Join to plan smart and reduce stress</p>
        </div>
        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-row">
                <div class="form-group half">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Choose a username">
                </div>
                <div class="form-group half">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group half">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group half">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="10" max="100" required placeholder="e.g. 20">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group half">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>
                <div class="form-group half">
                    <label for="study">Field of Study</label>
                    <select id="study" name="study" required>
                        <option value="">Select Option</option>
                        <option value="B.Tech">B.Tech / Engineering</option>
                        <option value="Degree">Degree (B.Sc, B.A, etc.)</option>
                        <option value="Masters">Masters</option>
                        <option value="High School">High School</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a strong password">
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-4">Sign Up</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
    </div>
</div>
{% endblock %}
